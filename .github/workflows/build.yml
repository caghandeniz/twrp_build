name: Build TWRP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant: [no_crypto, no_display, no_version, minimal]
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y repo git-core gnupg flex bison build-essential zip unzip curl \
            zlib1g-dev libc6-dev-i386 lib32ncurses-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc fontconfig libncurses5 bc rsync lz4 \
            python3 python3-pip openjdk-17-jdk

      - name: Init TWRP source
        run: |
          mkdir -p ~/twrp
          cd ~/twrp
          git config --global user.email "caghandeniz2013cd@outlook.com"
          git config --global user.name "caghandeniz"
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1 --no-repo-verify

      - name: Add local manifest
        run: |
          mkdir -p ~/twrp/.repo/local_manifests
          cat > ~/twrp/.repo/local_manifests/local_manifest.xml << 'EOL'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="mygithub" fetch="https://github.com/" />
            <project name="caghandeniz/twrp_device_ant_B2_Ultra" path="device/ant/B2_Ultra" remote="mygithub" revision="main" />
          </manifest>
          EOL

      - name: Repo sync
        timeout-minutes: 60
        run: |
          cd ~/twrp
          repo sync -c -j$(nproc --all) --force-sync --no-tags --no-clone-bundle --fail-fast

      - name: Apply variant
        run: |
          cd ~/twrp/device/ant/B2_Ultra
          strip_crypto()  { sed -i '/^TW_INCLUDE_CRYPTO/d;/^TW_INCLUDE_FDBE/d;/^BOARD_USES_METADATA_PARTITION/d' BoardConfig.mk; }
          strip_display() { sed -i '/^RECOVERY_GRAPHICS_FORCE_USE_LINELENGTH/d;/^TW_BRIGHTNESS_PATH/d' BoardConfig.mk; }
          strip_version() { sed -i 's/^PLATFORM_VERSION := .*/PLATFORM_VERSION := 16.1.0/' BoardConfig.mk; }
          case "${{ matrix.variant }}" in
            no_crypto)  strip_crypto ;;
            no_display) strip_display ;;
            no_version) strip_version ;;
            minimal)    strip_crypto; strip_display; strip_version ;;
          esac
          grep -nE "TW_INCLUDE|LINELENGTH|BRIGHTNESS|PLATFORM_VERSION|METADATA|PIXEL" BoardConfig.mk

      - name: Build TWRP
        run: |
          cd ~/twrp
          source build/envsetup.sh
          lunch twrp_B2_Ultra-eng
          mka vendorbootimage

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-${{ matrix.variant }}
          path: ~/twrp/out/target/product/B2_Ultra/*.img