name: Build TWRP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h
          nproc --all
          free -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y repo git-core gnupg flex bison build-essential zip unzip curl \
            zlib1g-dev libc6-dev-i386 lib32ncurses-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc fontconfig libncurses5 bc rsync lz4 \
            python3 python3-pip openjdk-17-jdk

      - name: Init TWRP source
        run: |
          mkdir -p ~/twrp
          cd ~/twrp
          git config --global user.email "caghandeniz2013cd@outlook.com"
          git config --global user.name "caghandeniz"
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1 --no-repo-verify

      - name: Add local manifest
        run: |
          mkdir -p ~/twrp/.repo/local_manifests
          cat > ~/twrp/.repo/local_manifests/local_manifest.xml << 'EOL'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="mygithub" fetch="https://github.com/" />
            <project name="caghandeniz/twrp_device_ant_B2_Ultra" path="device/ant/B2_Ultra" remote="mygithub" revision="main" />
          </manifest>
          EOL

      - name: Repo sync (with live progress monitor)
        timeout-minutes: 60
        run: |
          cd ~/twrp
          (
            START=$(date +%s)
            while true; do
              sleep 30
              NOW=$(date +%s)
              ELAPSED=$(( (NOW - START) / 60 ))
              SIZE=$(du -sh ~/twrp 2>/dev/null | cut -f1)
              echo ">>> [$ELAPSED dk geçti] Şu ana kadar indirilen: $SIZE"
            done
          ) &
          MONITOR_PID=$!

          repo sync -c -j$(nproc --all) --force-sync -v --no-tags --no-clone-bundle --fail-fast
          SYNC_EXIT=$?

          kill $MONITOR_PID 2>/dev/null || true
          exit $SYNC_EXIT

      - name: Build TWRP
        run: |
          cd ~/twrp
          source build/envsetup.sh
          lunch twrp_B2_Ultra-eng
          mka bootimage

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-B2_Ultra
          path: ~/twrp/out/target/product/B2_Ultra/*.img

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            ~/twrp/.repo/manifest.xml
            ~/twrp/.repo/local_manifests/
