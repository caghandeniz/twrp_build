name: Build TWRP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y repo git python3 python3-pip openjdk-17-jdk

      - name: Init TWRP source
        run: |
          mkdir -p ~/twrp
          cd ~/twrp
          git config --global user.email "caghandeniz2013cd@outlook.com"
          git config --global user.name "caghandeniz"
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1

      - name: Add local manifest
        run: |
          mkdir -p ~/twrp/.repo/local_manifests
          cat > ~/twrp/.repo/local_manifests/local_manifest.xml << 'EOL'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="mygithub" fetch="https://github.com/" />
            <project name="caghandeniz/twrp_device_ant_B2_Ultra" path="device/ant/B2_Ultra" remote="mygithub" revision="main" />
          </manifest>
          EOL

      - name: Repo sync
        run: |
          cd ~/twrp
          repo sync -j4 --force-sync

      - name: Build TWRP
        run: |
          cd ~/twrp
          source build/envsetup.sh
          lunch omni_B2_Ultra-eng
          mka recoveryimage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: twrp-B2_Ultra
          path: ~/twrp/out/target/product/B2_Ultra/*.img
